<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIoT 任务管理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
.header { background: #2196F3; color: white; padding: 16px; text-align: center; font-size: 18px; }
.tabs { display: flex; overflow-x: auto; padding: 8px; gap: 8px; background: white; }
.tab { padding: 8px 16px; border-radius: 20px; border: 1px solid #ddd; background: white; cursor: pointer; white-space: nowrap; }
.tab.active { background: #2196F3; color: white; border-color: #2196F3; }
.tab-add { background: #4CAF50; color: white; border-color: #4CAF50; }
.task-list { padding: 8px; }
.task { background: white; border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
.task.done { opacity: 0.6; }
.task-checkbox { width: 24px; height: 24px; cursor: pointer; }
.task-content { flex: 1; }
.task-text { font-size: 16px; }
.task-text.done { text-decoration: line-through; color: #999; }
.task-meta { font-size: 12px; color: #666; margin-top: 4px; }
.task-delete { color: #f44336; cursor: pointer; font-size: 20px; }
.add-btn, .add-list-btn { display: block; width: calc(100% - 16px); margin: 8px; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
.danger-btn { display: block; width: calc(100% - 16px); margin: 8px; padding: 12px; background: #f44336; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
.modal.active { display: flex; }
.modal-content { background: white; border-radius: 12px; padding: 20px; width: 90%; max-width: 400px; }
.modal-title { font-size: 18px; margin-bottom: 16px; }
.modal-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 12px; font-size: 16px; }
.modal-select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 12px; font-size: 16px; }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
.modal-btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; }
.btn-cancel { background: #ddd; }
.btn-ok { background: #2196F3; color: white; }
</style>
</head>
<body>
<div class="header">AIoT 任务管理</div>
<button class="add-list-btn" id="addListBtn">+ 新建清单</button>
<div class="tabs" id="tabs"></div>
<div class="task-list" id="taskList"></div>
<button class="add-btn" id="addTaskBtn">+ 添加任务</button>
<button class="danger-btn" id="delListBtn">删除清单</button>

<!-- Standby Image Section -->
<div style="margin:8px;padding:16px;background:white;border-radius:8px;">
  <div style="font-size:16px;font-weight:bold;margin-bottom:12px;">🖼️ 待机画面</div>
  <div style="margin-bottom:12px;">
    <input type="file" id="standbyFile" accept="image/bmp,image/png,image/jpeg" style="font-size:14px;">
  </div>
  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <canvas id="standbyPreview" width="100" height="100" style="border:1px solid #ddd;border-radius:4px;background:#fff;image-rendering:pixelated;"></canvas>
    <div style="font-size:12px;color:#666;flex:1;">
      上传 200×200 单色图片<br>
      支持 BMP/PNG/JPG<br>
      自动转换为 1bpp 格式
    </div>
  </div>
  <button class="add-btn" id="uploadStandbyBtn" style="background:#FF9800;">上传待机画面</button>
  <button class="danger-btn" id="delStandbyBtn">恢复默认画面</button>
</div>

<!-- WiFi Settings Section -->
<div style="margin:8px;padding:16px;background:white;border-radius:8px;">
  <div style="font-size:16px;font-weight:bold;margin-bottom:12px;">📡 WiFi 设置</div>
  <input class="modal-input" id="wifiSsid" placeholder="WiFi 名称 (SSID)" style="margin-bottom:8px;">
  <input class="modal-input" id="wifiPassword" type="password" placeholder="WiFi 密码（开放网络留空）" style="margin-bottom:8px;">
  <div id="wifiStatus" style="font-size:12px;color:#666;margin-bottom:8px;"></div>
  <button class="add-btn" id="wifiSaveBtn" style="background:#2196F3;">保存并连接</button>
</div>

<div class="modal" id="taskModal">
<div class="modal-content">
  <div class="modal-title">新建任务</div>
  <input class="modal-input" id="taskText" placeholder="任务内容">
  <select class="modal-select" id="taskPriority">
    <option value="0">普通</option>
    <option value="1">重要</option>
    <option value="2">紧急</option>
  </select>
  <input class="modal-input" id="taskDue" type="date">
  <div class="modal-btns">
    <button class="modal-btn btn-cancel" onclick="closeModal()">取消</button>
    <button class="modal-btn btn-ok" onclick="submitTask()">确定</button>
  </div>
</div>
</div>

<div class="modal" id="listModal">
<div class="modal-content">
  <div class="modal-title">新建清单</div>
  <input class="modal-input" id="listName" placeholder="清单名称">
  <div class="modal-btns">
    <button class="modal-btn btn-cancel" onclick="closeListModal()">取消</button>
    <button class="modal-btn btn-ok" onclick="submitList()">确定</button>
  </div>
</div>
</div>

<script>
const API = '';
let lists = [];
let currentListId = null;

async function loadLists() {
  const res = await fetch(API + '/api/lists');
  const data = await res.json();
  if (data.ok) {
    lists = data.data;
    if (!currentListId && lists.length > 0) currentListId = lists[0].id;
    renderTabs();
    loadTasks();
  }
}

async function loadTasks() {
  if (!currentListId) {
    document.getElementById('taskList').innerHTML = '<p style="padding:16px;color:#999">暂无清单，请先创建</p>';
    return;
  }
  const res = await fetch(API + '/api/lists/' + currentListId + '/tasks');
  const data = await res.json();
  if (data.ok) renderTasks(data.data);
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = lists.map(l =>
    `<div class="tab ${l.id === currentListId ? 'active' : ''}" onclick="switchList('${l.id}')">${l.name}</div>`
  ).join('');
}

function renderTasks(tasks) {
  const list = document.getElementById('taskList');
  if (tasks.length === 0) {
    list.innerHTML = '<p style="padding:16px;color:#999">暂无任务</p>';
    return;
  }
  list.innerHTML = tasks.map(t => {
    const pri = ['', '🟡重要', '🔴紧急'][t.priority] || '';
    const due = t.due ? `📅 ${t.due}` : '';
    return `<div class="task ${t.done ? 'done' : ''}">
      <input type="checkbox" class="task-checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${t.id}', this.checked)">
      <div class="task-content">
        <div class="task-text ${t.done ? 'done' : ''}">${t.text}</div>
        <div class="task-meta">${pri} ${due}</div>
      </div>
      <span class="task-delete" onclick="deleteTask('${t.id}')">×</span>
    </div>`;
  }).join('');
}

function switchList(id) {
  currentListId = id;
  loadLists();
}

async function toggleTask(id, done) {
  await fetch(API + '/api/tasks/' + id, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({done})
  });
  loadTasks();
}

async function deleteTask(id) {
  if (!confirm('删除此任务？')) return;
  await fetch(API + '/api/tasks/' + id, {method: 'DELETE'});
  loadTasks();
}

function openModal() { document.getElementById('taskModal').classList.add('active'); }
function closeModal() { document.getElementById('taskModal').classList.remove('active'); }
function openListModal() { document.getElementById('listModal').classList.add('active'); }
function closeListModal() { document.getElementById('listModal').classList.remove('active'); }

async function submitTask() {
  if (!currentListId) return alert('请先创建一个清单');
  const text = document.getElementById('taskText').value.trim();
  if (!text) return alert('请输入任务内容');
  const priority = parseInt(document.getElementById('taskPriority').value);
  const due = document.getElementById('taskDue').value;
  await fetch(API + '/api/lists/' + currentListId + '/tasks', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({text, priority, due: due || ''})
  });
  closeModal();
  document.getElementById('taskText').value = '';
  loadTasks();
}

async function submitList() {
  const name = document.getElementById('listName').value.trim();
  if (!name) return alert('请输入清单名称');
  const res = await fetch(API + '/api/lists', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({name, icon: '[]'})
  });
  const data = await res.json();
  closeListModal();
  document.getElementById('listName').value = '';
  // Auto-select newly created list
  if (data.ok && data.data) {
    currentListId = data.data.id;
  }
  loadLists();
}

document.getElementById('addTaskBtn').onclick = openModal;
document.getElementById('addListBtn').onclick = openListModal;
document.getElementById('delListBtn').onclick = async () => {
  if (!currentListId) return;
  if (!confirm('删除此清单及所有任务？')) return;
  await fetch(API + '/api/lists/' + currentListId, {method: 'DELETE'});
  currentListId = null;
  loadLists();
};

loadLists();

/* ── Standby image upload ── */
const standbyCanvas = document.getElementById('standbyPreview');
const standbyCtx = standbyCanvas.getContext('2d');
let standbyRawData = null;  // Uint8Array of 5000 bytes (1bpp, EPD format)

// Preview uploaded image
document.getElementById('standbyFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const img = new Image();
  img.onload = function() {
    // Draw to a 200x200 offscreen canvas, then convert to 1bpp
    const offscreen = document.createElement('canvas');
    offscreen.width = 200;
    offscreen.height = 200;
    const ctx = offscreen.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, 200, 200);
    ctx.drawImage(img, 0, 0, 200, 200);

    const imgData = ctx.getImageData(0, 0, 200, 200);
    // Convert to 1bpp: EPD format (1=white, 0=black)
    const raw = new Uint8Array(5000);
    for (let y = 0; y < 200; y++) {
      for (let x = 0; x < 200; x++) {
        const idx = (y * 200 + x) * 4;
        const gray = imgData.data[idx] * 0.299 + imgData.data[idx+1] * 0.587 + imgData.data[idx+2] * 0.114;
        const white = gray > 128;
        const byteIdx = y * 25 + (x >> 3);
        const bit = 7 - (x & 7);
        if (white) raw[byteIdx] |= (1 << bit);
      }
    }
    standbyRawData = raw;

    // Show preview (scale to 100x100)
    standbyCtx.fillStyle = '#fff';
    standbyCtx.fillRect(0, 0, 100, 100);
    for (let y = 0; y < 200; y += 2) {
      for (let x = 0; x < 200; x += 2) {
        const byteIdx = y * 25 + (x >> 3);
        const bit = 7 - (x & 7);
        const isWhite = (raw[byteIdx] >> bit) & 1;
        standbyCtx.fillStyle = isWhite ? '#fff' : '#000';
        standbyCtx.fillRect(x/2, y/2, 1, 1);
      }
    }
  };
  img.src = URL.createObjectURL(file);
});

// Upload to device
document.getElementById('uploadStandbyBtn').onclick = async function() {
  if (!standbyRawData) return alert('请先选择图片');
  try {
    const res = await fetch(API + '/api/standby', {
      method: 'POST',
      headers: {'Content-Type': 'application/octet-stream'},
      body: standbyRawData
    });
    const data = await res.json();
    if (data.ok) alert('待机画面已更新！');
    else alert('上传失败: ' + data.error);
  } catch(e) {
    alert('上传出错: ' + e.message);
  }
};

// Delete custom image
document.getElementById('delStandbyBtn').onclick = async function() {
  if (!confirm('恢复默认待机画面？')) return;
  try {
    await fetch(API + '/api/standby', {method: 'DELETE'});
    standbyCtx.fillStyle = '#ddd';
    standbyCtx.fillRect(0, 0, 100, 100);
    standbyCtx.fillStyle = '#999';
    standbyCtx.font = '12px sans-serif';
    standbyCtx.textAlign = 'center';
    standbyCtx.fillText('默认', 50, 55);
    standbyRawData = null;
    document.getElementById('standbyFile').value = '';
    alert('已恢复默认画面');
  } catch(e) {
    alert('操作出错: ' + e.message);
  }
};

// Try loading existing custom image on page load
(async function() {
  try {
    const res = await fetch(API + '/api/standby');
    if (res.ok) {
      standbyCtx.fillStyle = '#4CAF50';
      standbyCtx.fillRect(0, 0, 100, 100);
      standbyCtx.fillStyle = '#fff';
      standbyCtx.font = '12px sans-serif';
      standbyCtx.textAlign = 'center';
      standbyCtx.fillText('自定义', 50, 55);
    }
  } catch(e) {}
})();

/* ── WiFi settings ── */
async function loadWifiStatus() {
  try {
    const res = await fetch(API + '/api/wifi');
    const data = await res.json();
    if (data.ok) {
      document.getElementById('wifiSsid').value = data.data.ssid || '';
      const status = document.getElementById('wifiStatus');
      if (data.data.connected) {
        status.textContent = '✅ 已连接: ' + data.data.ssid;
        status.style.color = '#4CAF50';
      } else {
        status.textContent = '❌ 未连接';
        status.style.color = '#f44336';
      }
    }
  } catch(e) {}
}

document.getElementById('wifiSaveBtn').onclick = async function() {
  const ssid = document.getElementById('wifiSsid').value.trim();
  const password = document.getElementById('wifiPassword').value;
  if (!ssid) return alert('请输入 WiFi 名称');

  const status = document.getElementById('wifiStatus');
  status.textContent = '⏳ 正在连接...';
  status.style.color = '#FF9800';

  try {
    const res = await fetch(API + '/api/wifi', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ssid, password})
    });
    const data = await res.json();
    if (data.ok) {
      status.textContent = '⏳ 凭据已保存，正在重连...';
      // Poll connection status
      let attempts = 0;
      const poll = setInterval(async () => {
        attempts++;
        try {
          const r = await fetch(API + '/api/wifi');
          const d = await r.json();
          if (d.ok && d.data.connected) {
            status.textContent = '✅ 已连接: ' + d.data.ssid;
            status.style.color = '#4CAF50';
            clearInterval(poll);
          } else if (attempts >= 15) {
            status.textContent = '❌ 连接超时，请检查凭据';
            status.style.color = '#f44336';
            clearInterval(poll);
          }
        } catch(e) {
          if (attempts >= 15) clearInterval(poll);
        }
      }, 2000);
    } else {
      status.textContent = '❌ 保存失败: ' + data.error;
      status.style.color = '#f44336';
    }
  } catch(e) {
    status.textContent = '❌ 出错: ' + e.message;
    status.style.color = '#f44336';
  }
};

loadWifiStatus();
</script>
</body>
</html>
